name: Build and publish Windows installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-publish:
    name: Build, sign, and publish
    runs-on: [windows-latest, win11]
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out the release commit
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          foreach ($command in @('git.exe', 'gpg.exe')) {
              if ($null -eq (Get-Command -Name $command -CommandType Application -ErrorAction SilentlyContinue)) {
                  throw "Required command '$command' is not installed on the Windows runner."
              }
          }

          if ([string]::IsNullOrWhiteSpace($env:FORGEJO_TOKEN)) {
              throw 'FORGEJO_TOKEN was not provided by Forgejo Actions.'
          }

          $ref = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_REF)) {
              $env:FORGEJO_REF
          }
          else {
              $env:GITHUB_REF
          }

          if ($ref -notmatch '^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?)$') {
              throw "This workflow publishes releases only from version tags such as v1.0.0. Received '$ref'."
          }

          $tag = $Matches[1]
          $serverUrl = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_SERVER_URL)) {
              $env:FORGEJO_SERVER_URL
          }
          else {
              $env:GITHUB_SERVER_URL
          }
          $repository = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_REPOSITORY)) {
              $env:FORGEJO_REPOSITORY
          }
          else {
              $env:GITHUB_REPOSITORY
          }
          $commitSha = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_SHA)) {
              $env:FORGEJO_SHA
          }
          else {
              $env:GITHUB_SHA
          }
          $environmentFile = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_ENV)) {
              $env:FORGEJO_ENV
          }
          else {
              $env:GITHUB_ENV
          }
          if ([string]::IsNullOrWhiteSpace($serverUrl) -or
              [string]::IsNullOrWhiteSpace($repository) -or
              [string]::IsNullOrWhiteSpace($commitSha) -or
              [string]::IsNullOrWhiteSpace($environmentFile) -or
              [string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
              throw 'Required Forgejo Actions repository context is unavailable.'
          }

          $repositoryUrl = "$serverUrl/$repository.git"
          $runId = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_RUN_ID)) {
              $env:FORGEJO_RUN_ID
          }
          else {
              $env:GITHUB_RUN_ID
          }
          $runAttempt = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_RUN_ATTEMPT)) {
              $env:FORGEJO_RUN_ATTEMPT
          }
          else {
              $env:GITHUB_RUN_ATTEMPT
          }
          if ($runId -notmatch '^[0-9]+$') {
              throw "The workflow run ID is unavailable or invalid: '$runId'."
          }
          if ($runAttempt -notmatch '^[0-9]+$') {
              $runAttempt = '1'
          }
          $sourceDirectory = Join-Path `
              -Path $env:RUNNER_TEMP `
              -ChildPath "wintime-source-$runId-$runAttempt"
          if (Test-Path -LiteralPath $sourceDirectory) {
              throw "The isolated checkout path already exists: '$sourceDirectory'."
          }
          New-Item -ItemType Directory -Path $sourceDirectory | Out-Null
          $credentials = [Convert]::ToBase64String(
              [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:FORGEJO_TOKEN")
          )

          git -C $sourceDirectory init .
          if ($LASTEXITCODE -ne 0) {
              throw "git init failed with exit code $LASTEXITCODE."
          }

          $existingOrigin = git -C $sourceDirectory remote get-url origin 2>$null
          if ($LASTEXITCODE -eq 0) {
              git -C $sourceDirectory remote set-url origin $repositoryUrl
          }
          else {
              git -C $sourceDirectory remote add origin $repositoryUrl
          }
          if ($LASTEXITCODE -ne 0) {
              throw "Configuring the Forgejo origin failed with exit code $LASTEXITCODE."
          }

          try {
              $env:GIT_CONFIG_COUNT = '1'
              $env:GIT_CONFIG_KEY_0 = 'http.extraHeader'
              $env:GIT_CONFIG_VALUE_0 = "Authorization: Basic $credentials"
              git -C $sourceDirectory fetch --no-tags --depth=1 origin $commitSha
              if ($LASTEXITCODE -ne 0) {
                  throw "Fetching release commit $commitSha failed with exit code $LASTEXITCODE."
              }
          }
          finally {
              Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
              Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
              Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }

          git -C $sourceDirectory checkout --detach --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
              throw "Checking out release commit $commitSha failed with exit code $LASTEXITCODE."
          }

          $utf8NoBom = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($environmentFile, "RELEASE_TAG=$tag`n", $utf8NoBom)
          [IO.File]::AppendAllText($environmentFile, "SOURCE_DIRECTORY=$sourceDirectory`n", $utf8NoBom)

      - name: Validate version and build dependencies
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:SOURCE_DIRECTORY

          $installerDefinition = Get-Content -LiteralPath 'installer\TimeSync.iss' -Raw
          if ($installerDefinition -notmatch '(?m)^#define AppVersion "([0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?)"$') {
              throw 'Unable to read AppVersion from installer\TimeSync.iss.'
          }

          $version = $Matches[1]
          if ($env:RELEASE_TAG -ne "v$version") {
              throw "Release tag '$env:RELEASE_TAG' does not match installer version '$version'."
          }

          $isccCandidates = @(
              (Get-Command -Name 'ISCC.exe' -CommandType Application -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty Source),
              (Join-Path -Path $env:ProgramFiles -ChildPath 'Inno Setup 6\ISCC.exe'),
              (Join-Path -Path ${env:ProgramFiles(x86)} -ChildPath 'Inno Setup 6\ISCC.exe'),
              (Join-Path -Path $env:LOCALAPPDATA -ChildPath 'Programs\Inno Setup 6\ISCC.exe')
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          if ($null -eq ($isccCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)) {
              throw 'Inno Setup 6 is not installed on the Windows runner. Install it before running this workflow.'
          }

          $utf8NoBom = New-Object Text.UTF8Encoding($false)
          $environmentFile = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_ENV)) {
              $env:FORGEJO_ENV
          }
          else {
              $env:GITHUB_ENV
          }
          [IO.File]::AppendAllText($environmentFile, "RELEASE_VERSION=$version`n", $utf8NoBom)

      - name: Build x64 and ARM64 installers
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:SOURCE_DIRECTORY

          $targets = @(
              @{ Architecture = 'x64'; FileName = "WinTime-$env:RELEASE_VERSION-windows-x64-setup.exe" },
              @{ Architecture = 'arm64'; FileName = "WinTime-$env:RELEASE_VERSION-windows-arm64-setup.exe" }
          )

          foreach ($target in $targets) {
              & '.\build-scripts\build.ps1' `
                  -Architecture $target.Architecture `
                  -OutputFileName $target.FileName
              if ($LASTEXITCODE -ne 0) {
                  throw "The $($target.Architecture) installer build failed with exit code $LASTEXITCODE."
              }

              $outputPath = Join-Path -Path 'dist' -ChildPath $target.FileName
              if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
                  throw "The $($target.Architecture) build did not produce '$outputPath'."
              }
          }

      - name: Create checksums and detached signatures
        env:
          CI_KEY_B64: ${{ secrets.CI_KEY_B64 }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:SOURCE_DIRECTORY

          if ([string]::IsNullOrWhiteSpace($env:CI_KEY_B64)) {
              throw 'The required CI_KEY_B64 secret is empty or unavailable.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CI_KEY_PASSPHRASE)) {
              throw 'The required CI_KEY_PASSPHRASE secret is empty or unavailable.'
          }

          $releaseDirectory = [IO.Path]::GetFullPath((Join-Path -Path $PWD -ChildPath 'dist'))
          $installers = @(
              (Join-Path -Path $releaseDirectory -ChildPath "WinTime-$env:RELEASE_VERSION-windows-x64-setup.exe"),
              (Join-Path -Path $releaseDirectory -ChildPath "WinTime-$env:RELEASE_VERSION-windows-arm64-setup.exe")
          )
          $keyFile = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'wintime-release-key.gpg'
          $gpgHome = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'wintime-gnupg'
          $previousGpgHome = $env:GNUPGHOME

          try {
              try {
                  $keyBytes = [Convert]::FromBase64String($env:CI_KEY_B64)
              }
              catch {
                  throw "CI_KEY_B64 is not valid base64: $($_.Exception.Message)"
              }

              [IO.File]::WriteAllBytes($keyFile, $keyBytes)
              New-Item -ItemType Directory -Path $gpgHome | Out-Null
              $env:GNUPGHOME = $gpgHome

              & gpg.exe --batch --import $keyFile
              if ($LASTEXITCODE -ne 0) {
                  throw "Importing CI_KEY_B64 failed with exit code $LASTEXITCODE."
              }

              $secretKeyRecords = @(& gpg.exe --batch --with-colons --list-secret-keys)
              if ($LASTEXITCODE -ne 0) {
                  throw "Listing imported secret keys failed with exit code $LASTEXITCODE."
              }

              $primaryKeyCount = @($secretKeyRecords | Where-Object { $_ -like 'sec:*' }).Count
              $primaryFingerprints = @()
              $expectPrimaryFingerprint = $false
              foreach ($record in $secretKeyRecords) {
                  $fields = $record -split ':'
                  if ($fields[0] -eq 'sec') {
                      $expectPrimaryFingerprint = $true
                  }
                  elseif ($expectPrimaryFingerprint -and $fields[0] -eq 'fpr') {
                      $primaryFingerprints += $fields[9]
                      $expectPrimaryFingerprint = $false
                  }
                  elseif ($fields[0] -eq 'ssb') {
                      $expectPrimaryFingerprint = $false
                  }
              }

              if ($primaryKeyCount -ne 1 -or $primaryFingerprints.Count -ne 1) {
                  throw "CI_KEY_B64 must contain exactly one primary secret key; found $primaryKeyCount."
              }
              $fingerprint = $primaryFingerprints[0]

              $checksumLines = foreach ($installer in $installers) {
                  if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
                      throw "Expected release installer is missing: '$installer'."
                  }
                  $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash *$([IO.Path]::GetFileName($installer))"
              }

              $checksumFile = Join-Path -Path $releaseDirectory -ChildPath 'SHA256SUMS'
              $utf8NoBom = New-Object Text.UTF8Encoding($false)
              [IO.File]::WriteAllText($checksumFile, (($checksumLines -join "`n") + "`n"), $utf8NoBom)

              foreach ($file in @($installers) + @($checksumFile)) {
                  $signature = "$file.sig"
                  $env:CI_KEY_PASSPHRASE | & gpg.exe `
                      --batch `
                      --yes `
                      --pinentry-mode loopback `
                      --passphrase-fd 0 `
                      --local-user $fingerprint `
                      --output $signature `
                      --detach-sign $file
                  if ($LASTEXITCODE -ne 0) {
                      throw "Signing '$file' failed with exit code $LASTEXITCODE."
                  }

                  & gpg.exe --batch --verify $signature $file
                  if ($LASTEXITCODE -ne 0) {
                      throw "Signature verification failed for '$file' with exit code $LASTEXITCODE."
                  }
              }

              foreach ($line in Get-Content -LiteralPath $checksumFile) {
                  if ($line -notmatch '^([0-9a-f]{64}) \*(.+)$') {
                      throw "Invalid SHA256SUMS entry: '$line'."
                  }
                  $artifactPath = Join-Path -Path $releaseDirectory -ChildPath $Matches[2]
                  $actualHash = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($actualHash -ne $Matches[1]) {
                      throw "SHA256 verification failed for '$($Matches[2])'."
                  }
              }

              $utf8NoBom = New-Object Text.UTF8Encoding($false)
              $environmentFile = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_ENV)) {
                  $env:FORGEJO_ENV
              }
              else {
                  $env:GITHUB_ENV
              }
              [IO.File]::AppendAllText($environmentFile, "SIGNING_FINGERPRINT=$fingerprint`n", $utf8NoBom)
          }
          finally {
              $env:GNUPGHOME = $previousGpgHome
              if (Test-Path -LiteralPath $keyFile -PathType Leaf) {
                  Remove-Item -LiteralPath $keyFile -Force
              }
              if (Test-Path -LiteralPath $gpgHome -PathType Container) {
                  Remove-Item -LiteralPath $gpgHome -Recurse -Force
              }
          }

      - name: Publish Forgejo release
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:SOURCE_DIRECTORY

          $apiUrl = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_API_URL)) {
              $env:FORGEJO_API_URL
          }
          else {
              $env:GITHUB_API_URL
          }
          $repository = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_REPOSITORY)) {
              $env:FORGEJO_REPOSITORY
          }
          else {
              $env:GITHUB_REPOSITORY
          }
          if ([string]::IsNullOrWhiteSpace($apiUrl) -or
              [string]::IsNullOrWhiteSpace($repository) -or
              [string]::IsNullOrWhiteSpace($env:FORGEJO_TOKEN)) {
              throw 'Forgejo release API variables or token are unavailable.'
          }

          $headers = @{
              Authorization = "token $env:FORGEJO_TOKEN"
              Accept = 'application/json'
          }
          $repositoryApi = "$apiUrl/repos/$repository"
          $releaseBody = @"
          WinTime $env:RELEASE_VERSION for Windows x64 and Windows ARM64.

          Signing key fingerprint: $env:SIGNING_FINGERPRINT

          Verify an installer:
          gpg --verify <installer>.sig <installer>

          Verify the checksum manifest and installers:
          gpg --verify SHA256SUMS.sig SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          "@ -replace '(?m)^          ', ''
          $payload = @{
              tag_name = $env:RELEASE_TAG
              name = "WinTime $env:RELEASE_VERSION"
              body = $releaseBody
              draft = $false
              prerelease = ($env:RELEASE_VERSION -match '-')
          } | ConvertTo-Json

          try {
              $release = Invoke-RestMethod `
                  -Method Get `
                  -Uri "$repositoryApi/releases/tags/$env:RELEASE_TAG" `
                  -Headers $headers
              $release = Invoke-RestMethod `
                  -Method Patch `
                  -Uri "$repositoryApi/releases/$($release.id)" `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $payload
          }
          catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 404) {
                  throw
              }
              $release = Invoke-RestMethod `
                  -Method Post `
                  -Uri "$repositoryApi/releases" `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $payload
          }

          $assetPaths = @(
              "dist\WinTime-$env:RELEASE_VERSION-windows-x64-setup.exe",
              "dist\WinTime-$env:RELEASE_VERSION-windows-x64-setup.exe.sig",
              "dist\WinTime-$env:RELEASE_VERSION-windows-arm64-setup.exe",
              "dist\WinTime-$env:RELEASE_VERSION-windows-arm64-setup.exe.sig",
              'dist\SHA256SUMS',
              'dist\SHA256SUMS.sig'
          )
          $existingAssets = @(Invoke-RestMethod `
              -Method Get `
              -Uri "$repositoryApi/releases/$($release.id)/assets" `
              -Headers $headers)
          Add-Type -AssemblyName System.Net.Http

          foreach ($assetPath in $assetPaths) {
              if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
                  throw "Release asset is missing: '$assetPath'."
              }
              $assetName = [IO.Path]::GetFileName($assetPath)
              foreach ($existingAsset in @($existingAssets | Where-Object { $_.name -eq $assetName })) {
                  Invoke-RestMethod `
                      -Method Delete `
                      -Uri "$repositoryApi/releases/$($release.id)/assets/$($existingAsset.id)" `
                      -Headers $headers | Out-Null
              }

              $client = New-Object Net.Http.HttpClient
              try {
                  $client.DefaultRequestHeaders.Add('Authorization', "token $env:FORGEJO_TOKEN")
                  $content = New-Object Net.Http.MultipartFormDataContent
                  $stream = [IO.File]::OpenRead((Resolve-Path -LiteralPath $assetPath))
                  try {
                      $fileContent = New-Object Net.Http.StreamContent($stream)
                      $content.Add($fileContent, 'attachment', $assetName)
                      $encodedName = [Uri]::EscapeDataString($assetName)
                      $response = $client.PostAsync(
                          "$repositoryApi/releases/$($release.id)/assets?name=$encodedName",
                          $content
                      ).GetAwaiter().GetResult()
                      if (-not $response.IsSuccessStatusCode) {
                          $responseBody = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                          throw "Uploading Forgejo asset '$assetName' failed with HTTP $([int]$response.StatusCode): $responseBody"
                      }
                  }
                  finally {
                      if ($null -ne $stream) {
                          $stream.Dispose()
                      }
                      if ($null -ne $content) {
                          $content.Dispose()
                      }
                  }
              }
              finally {
                  $client.Dispose()
              }
          }

      - name: Mirror repository and release to GitHub
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:SOURCE_DIRECTORY

          if ([string]::IsNullOrWhiteSpace($env:GH_KEY)) {
              throw 'The required GH_KEY secret is empty or unavailable.'
          }

          $forgejoCredentials = [Convert]::ToBase64String(
              [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:FORGEJO_TOKEN")
          )
          $githubCredentials = [Convert]::ToBase64String(
              [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_KEY")
          )
          $mirrorDirectory = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'wintime-git-mirror.git'
          $serverUrl = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_SERVER_URL)) {
              $env:FORGEJO_SERVER_URL
          }
          else {
              $env:GITHUB_SERVER_URL
          }
          $repository = if (-not [string]::IsNullOrWhiteSpace($env:FORGEJO_REPOSITORY)) {
              $env:FORGEJO_REPOSITORY
          }
          else {
              $env:GITHUB_REPOSITORY
          }
          $forgejoRepositoryUrl = "$serverUrl/$repository.git"
          $githubRepositoryUrl = 'https://github.com/firebadnofire/WinTime.git'

          try {
              $env:GIT_CONFIG_COUNT = '1'
              $env:GIT_CONFIG_KEY_0 = 'http.extraHeader'
              $env:GIT_CONFIG_VALUE_0 = "Authorization: Basic $forgejoCredentials"
              git clone --bare $forgejoRepositoryUrl $mirrorDirectory
              if ($LASTEXITCODE -ne 0) {
                  throw "Cloning the Forgejo repository for mirroring failed with exit code $LASTEXITCODE."
              }

              git -C $mirrorDirectory remote add github $githubRepositoryUrl
              if ($LASTEXITCODE -ne 0) {
                  throw "Adding the GitHub mirror remote failed with exit code $LASTEXITCODE."
              }

              $env:GIT_CONFIG_VALUE_0 = "Authorization: Basic $githubCredentials"
              git -C $mirrorDirectory push --force --prune github `
                  'refs/heads/*:refs/heads/*' `
                  'refs/tags/*:refs/tags/*'
              if ($LASTEXITCODE -ne 0) {
                  throw "Mirroring Git heads and tags failed with exit code $LASTEXITCODE."
              }
          }
          finally {
              Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
              Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
              Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath $mirrorDirectory -PathType Container) {
                  Remove-Item -LiteralPath $mirrorDirectory -Recurse -Force
              }
          }

          $headers = @{
              Authorization = "Bearer $env:GH_KEY"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $repositoryApi = 'https://api.github.com/repos/firebadnofire/WinTime'
          $releaseBody = @"
          WinTime $env:RELEASE_VERSION for Windows x64 and Windows ARM64.

          Signing key fingerprint: $env:SIGNING_FINGERPRINT

          Verify an installer:
          gpg --verify <installer>.sig <installer>

          Verify the checksum manifest and installers:
          gpg --verify SHA256SUMS.sig SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          "@ -replace '(?m)^          ', ''
          $payload = @{
              tag_name = $env:RELEASE_TAG
              name = "WinTime $env:RELEASE_VERSION"
              body = $releaseBody
              draft = $false
              prerelease = ($env:RELEASE_VERSION -match '-')
          } | ConvertTo-Json

          try {
              $release = Invoke-RestMethod `
                  -Method Get `
                  -Uri "$repositoryApi/releases/tags/$env:RELEASE_TAG" `
                  -Headers $headers
              $release = Invoke-RestMethod `
                  -Method Patch `
                  -Uri "$repositoryApi/releases/$($release.id)" `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $payload
          }
          catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 404) {
                  throw
              }
              $release = Invoke-RestMethod `
                  -Method Post `
                  -Uri "$repositoryApi/releases" `
                  -Headers $headers `
                  -ContentType 'application/json' `
                  -Body $payload
          }

          $assetPaths = @(
              "dist\WinTime-$env:RELEASE_VERSION-windows-x64-setup.exe",
              "dist\WinTime-$env:RELEASE_VERSION-windows-x64-setup.exe.sig",
              "dist\WinTime-$env:RELEASE_VERSION-windows-arm64-setup.exe",
              "dist\WinTime-$env:RELEASE_VERSION-windows-arm64-setup.exe.sig",
              'dist\SHA256SUMS',
              'dist\SHA256SUMS.sig'
          )
          $existingAssets = @(Invoke-RestMethod `
              -Method Get `
              -Uri "$repositoryApi/releases/$($release.id)/assets?per_page=100" `
              -Headers $headers)

          foreach ($assetPath in $assetPaths) {
              if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
                  throw "Release asset is missing: '$assetPath'."
              }
              $assetName = [IO.Path]::GetFileName($assetPath)
              foreach ($existingAsset in @($existingAssets | Where-Object { $_.name -eq $assetName })) {
                  Invoke-RestMethod `
                      -Method Delete `
                      -Uri "$repositoryApi/releases/assets/$($existingAsset.id)" `
                      -Headers $headers | Out-Null
              }

              $encodedName = [Uri]::EscapeDataString($assetName)
              $uploadUri = "https://uploads.github.com/repos/firebadnofire/WinTime/releases/$($release.id)/assets?name=$encodedName"
              $uploadHeaders = @{
                  Authorization = "Bearer $env:GH_KEY"
                  Accept = 'application/vnd.github+json'
                  'X-GitHub-Api-Version' = '2022-11-28'
              }
              Invoke-RestMethod `
                  -Method Post `
                  -Uri $uploadUri `
                  -Headers $uploadHeaders `
                  -ContentType 'application/octet-stream' `
                  -InFile $assetPath | Out-Null
          }
