name: Build Windows installers

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Cross-compile Windows x64 installer
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out event commit
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${FORGEJO_TOKEN:?Forgejo did not provide FORGEJO_TOKEN}"
          : "${GITHUB_SHA:?Forgejo did not provide GITHUB_SHA}"

          repository_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?}}.git"
          credentials="$(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          test ! -e source || { echo 'The isolated source directory already exists.' >&2; exit 1; }
          git init source
          git -C source remote add origin "$repository_url"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="Authorization: Basic $credentials" \
            git -C source fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD

      - name: Install cross-packaging dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(. /etc/os-release; printf '%s' "${ID:-}")" = ubuntu
          if [[ "$EUID" -eq 0 ]]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nsis
          elif command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nsis
          else
            echo 'Installing NSIS requires root or sudo.' >&2
            exit 1
          fi

      - name: Build Windows x64 installer
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(sed -n 's/^!define APP_VERSION "\([^"]*\)"$/\1/p' source/installer/TimeSync.nsi)"
          test -n "$version" || { echo 'Unable to read APP_VERSION.' >&2; exit 1; }
          bash source/build-scripts/build-linux.sh \
            x64 \
            "WinTime-${version}-windows-x64-setup.exe"
          test -s "source/dist/WinTime-${version}-windows-x64-setup.exe"

      - name: Upload Windows x64 candidate
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wintime-windows-x64
          path: source/dist/WinTime-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  build-windows-arm64:
    name: Cross-compile Windows ARM64 installer
    runs-on: arm-ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out event commit
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${FORGEJO_TOKEN:?Forgejo did not provide FORGEJO_TOKEN}"
          : "${GITHUB_SHA:?Forgejo did not provide GITHUB_SHA}"

          repository_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?}}.git"
          credentials="$(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          test ! -e source || { echo 'The isolated source directory already exists.' >&2; exit 1; }
          git init source
          git -C source remote add origin "$repository_url"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="Authorization: Basic $credentials" \
            git -C source fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD

      - name: Install cross-packaging dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(. /etc/os-release; printf '%s' "${ID:-}")" = ubuntu
          if [[ "$EUID" -eq 0 ]]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nsis
          elif command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nsis
          else
            echo 'Installing NSIS requires root or sudo.' >&2
            exit 1
          fi

      - name: Build Windows ARM64 installer
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(sed -n 's/^!define APP_VERSION "\([^"]*\)"$/\1/p' source/installer/TimeSync.nsi)"
          test -n "$version" || { echo 'Unable to read APP_VERSION.' >&2; exit 1; }
          bash source/build-scripts/build-linux.sh \
            arm64 \
            "WinTime-${version}-windows-arm64-setup.exe"
          test -s "source/dist/WinTime-${version}-windows-arm64-setup.exe"

      - name: Upload Windows ARM64 candidate
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wintime-windows-arm64
          path: source/dist/WinTime-*-windows-arm64-setup.exe
          if-no-files-found: error
          retention-days: 7

  sign-and-mirror:
    name: Sign and mirror trusted builds
    needs: [build-windows-x64, build-windows-arm64]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Install signing and publication dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(. /etc/os-release; printf '%s' "${ID:-}")" = ubuntu
          packages=(ca-certificates curl git gnupg jq)
          if [[ "$EUID" -eq 0 ]]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}"
          elif command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}"
          else
            echo 'Installing signing dependencies requires root or sudo.' >&2
            exit 1
          fi

      - name: Check out event commit
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${FORGEJO_TOKEN:?Forgejo did not provide FORGEJO_TOKEN}"
          : "${GITHUB_SHA:?Forgejo did not provide GITHUB_SHA}"

          repository_url="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:?}}/${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?}}.git"
          credentials="$(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          test ! -e source || { echo 'The isolated source directory already exists.' >&2; exit 1; }
          git init source
          git -C source remote add origin "$repository_url"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="Authorization: Basic $credentials" \
            git -C source fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD

      - name: Download Windows x64 candidate
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: wintime-windows-x64
          path: staging

      - name: Download Windows ARM64 candidate
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: wintime-windows-arm64
          path: staging

      - name: Validate candidates and release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(sed -n 's/^!define APP_VERSION "\([^"]*\)"$/\1/p' source/installer/TimeSync.nsi)"
          test -n "$version" || { echo 'Unable to read APP_VERSION.' >&2; exit 1; }
          test -s "staging/WinTime-${version}-windows-x64-setup.exe"
          test -s "staging/WinTime-${version}-windows-arm64-setup.exe"

          ref="${FORGEJO_REF:-${GITHUB_REF:?}}"
          if [[ "$ref" == refs/tags/* ]]; then
            tag="${ref#refs/tags/}"
            [[ "$tag" == "v${version}" ]] || {
              printf "Release tag '%s' does not match installer version '%s'.\n" "$tag" "$version" >&2
              exit 1
            }
            printf 'RELEASE_TAG=%s\n' "$tag" >> "${FORGEJO_ENV:-${GITHUB_ENV:?}}"
          fi
          printf 'RELEASE_VERSION=%s\n' "$version" >> "${FORGEJO_ENV:-${GITHUB_ENV:?}}"

      - name: Create checksums and detached signatures
        shell: bash
        env:
          CI_KEY_B64: ${{ secrets.CI_KEY_B64 }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          : "${CI_KEY_B64:?Missing required secret CI_KEY_B64}"
          : "${CI_KEY_PASSPHRASE:?Missing required secret CI_KEY_PASSPHRASE}"

          key_file="$(mktemp "${RUNNER_TEMP:?}/wintime-release-key.XXXXXXXX")"
          gpg_home="$(mktemp -d "${RUNNER_TEMP:?}/wintime-gnupg.XXXXXXXX")"
          cleanup() {
            rm -f -- "$key_file"
            rm -rf -- "$gpg_home"
          }
          trap cleanup EXIT
          chmod 700 "$gpg_home"
          export GNUPGHOME="$gpg_home"

          if ! printf '%s' "$CI_KEY_B64" | base64 --decode > "$key_file"; then
            echo 'CI_KEY_B64 is not valid base64.' >&2
            exit 1
          fi
          gpg --batch --import "$key_file"

          mapfile -t fingerprints < <(
            gpg --batch --with-colons --list-secret-keys \
              | awk -F: '$1 == "sec" { want = 1; next } want && $1 == "fpr" { print $10; want = 0 }'
          )
          [[ "${#fingerprints[@]}" -eq 1 ]] || {
            printf 'CI_KEY_B64 must contain exactly one primary secret key; found %s.\n' \
              "${#fingerprints[@]}" >&2
            exit 1
          }
          fingerprint="${fingerprints[0]}"

          artifacts=(
            "staging/WinTime-${RELEASE_VERSION}-windows-x64-setup.exe"
            "staging/WinTime-${RELEASE_VERSION}-windows-arm64-setup.exe"
          )
          (
            cd staging
            sha256sum -- \
              "WinTime-${RELEASE_VERSION}-windows-x64-setup.exe" \
              "WinTime-${RELEASE_VERSION}-windows-arm64-setup.exe" \
              > SHA256SUMS
          )

          for file in "${artifacts[@]}" staging/SHA256SUMS; do
            printf '%s\n' "$CI_KEY_PASSPHRASE" \
              | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                  --local-user "$fingerprint" --output "${file}.sig" --detach-sign "$file"
            gpg --batch --verify "${file}.sig" "$file"
          done
          (cd staging && sha256sum --check --strict SHA256SUMS)

          printf 'SIGNING_FINGERPRINT=%s\n' "$fingerprint" \
            >> "${FORGEJO_ENV:-${GITHUB_ENV:?}}"

      - name: Upload signed build bundle
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wintime-windows-signed
          path: staging/*
          if-no-files-found: error
          retention-days: 14

      - name: Mirror Git heads and tags
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
        run: |
          set -Eeuo pipefail
          : "${GH_KEY:?Missing required secret GH_KEY}"
          : "${FORGEJO_TOKEN:?Forgejo did not provide FORGEJO_TOKEN}"

          forgejo_credentials="$(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="Authorization: Basic $forgejo_credentials" \
            git -C source fetch origin \
              '+refs/heads/*:refs/remotes/forgejo/*' \
              '+refs/tags/*:refs/tags/*'

          git -C source remote add github 'https://github.com/firebadnofire/WinTime.git'
          github_credentials="$(printf 'x-access-token:%s' "$GH_KEY" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="Authorization: Basic $github_credentials" \
            git -C source push --force --prune github \
              '+refs/remotes/forgejo/*:refs/heads/*' \
              '+refs/tags/*:refs/tags/*'

      - name: Publish Forgejo release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${FORGEJO_TOKEN:?Forgejo did not provide FORGEJO_TOKEN}"
          : "${RELEASE_TAG:?Release tag was not resolved}"
          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:?}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?}}"
          repository_api="${api_url}/repos/${repository}"
          response_file="$(mktemp "${RUNNER_TEMP:?}/forgejo-release.XXXXXXXX")"
          payload_file="$(mktemp "${RUNNER_TEMP:?}/forgejo-payload.XXXXXXXX")"
          cleanup() { rm -f -- "$response_file" "$payload_file"; }
          trap cleanup EXIT

          release_body="$(cat <<EOF
          WinTime ${RELEASE_VERSION} for Windows x64 and Windows ARM64.

          Signing key fingerprint: ${SIGNING_FINGERPRINT}

          Verify an installer:
          gpg --verify <installer>.sig <installer>

          Verify the checksum manifest and installers:
          gpg --verify SHA256SUMS.sig SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          EOF
          )"
          prerelease=false
          [[ "$RELEASE_VERSION" == *-* ]] && prerelease=true
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg name "WinTime ${RELEASE_VERSION}" \
            --arg body "$release_body" \
            --argjson prerelease "$prerelease" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: $prerelease}' \
            > "$payload_file"

          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            --header 'Accept: application/json' \
            "${repository_api}/releases/tags/${RELEASE_TAG}")"
          if [[ "$status" == 200 ]]; then
            release_id="$(jq -r '.id' "$response_file")"
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "Authorization: token ${FORGEJO_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${payload_file}" \
              "${repository_api}/releases/${release_id}" > "$response_file"
          elif [[ "$status" == 404 ]]; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: token ${FORGEJO_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${payload_file}" \
              "${repository_api}/releases" > "$response_file"
            release_id="$(jq -r '.id' "$response_file")"
          else
            printf 'Forgejo release lookup failed with HTTP %s: ' "$status" >&2
            cat "$response_file" >&2
            exit 1
          fi
          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo 'Forgejo release response had no numeric id.' >&2; exit 1; }

          existing_assets="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            "${repository_api}/releases/${release_id}/assets")"
          for asset in staging/*; do
            asset_name="$(basename -- "$asset")"
            while IFS= read -r asset_id; do
              [[ -n "$asset_id" ]] || continue
              curl --fail-with-body --silent --show-error \
                --request DELETE \
                --header "Authorization: token ${FORGEJO_TOKEN}" \
                "${repository_api}/releases/${release_id}/assets/${asset_id}" > /dev/null
            done < <(jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' <<< "$existing_assets")
            encoded_name="$(jq -rn --arg value "$asset_name" '$value | @uri')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: token ${FORGEJO_TOKEN}" \
              --form "attachment=@${asset}" \
              "${repository_api}/releases/${release_id}/assets?name=${encoded_name}" > /dev/null
          done

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
        run: |
          set -Eeuo pipefail
          : "${GH_KEY:?Missing required secret GH_KEY}"
          : "${RELEASE_TAG:?Release tag was not resolved}"
          repository_api='https://api.github.com/repos/firebadnofire/WinTime'
          response_file="$(mktemp "${RUNNER_TEMP:?}/github-release.XXXXXXXX")"
          payload_file="$(mktemp "${RUNNER_TEMP:?}/github-payload.XXXXXXXX")"
          cleanup() { rm -f -- "$response_file" "$payload_file"; }
          trap cleanup EXIT

          release_body="$(cat <<EOF
          WinTime ${RELEASE_VERSION} for Windows x64 and Windows ARM64.

          Signing key fingerprint: ${SIGNING_FINGERPRINT}

          Verify an installer:
          gpg --verify <installer>.sig <installer>

          Verify the checksum manifest and installers:
          gpg --verify SHA256SUMS.sig SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          EOF
          )"
          prerelease=false
          [[ "$RELEASE_VERSION" == *-* ]] && prerelease=true
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg name "WinTime ${RELEASE_VERSION}" \
            --arg body "$release_body" \
            --argjson prerelease "$prerelease" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: $prerelease}' \
            > "$payload_file"

          github_headers=(
            --header "Authorization: Bearer ${GH_KEY}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            "${github_headers[@]}" \
            "${repository_api}/releases/tags/${RELEASE_TAG}")"
          if [[ "$status" == 200 ]]; then
            release_id="$(jq -r '.id' "$response_file")"
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              "${github_headers[@]}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${payload_file}" \
              "${repository_api}/releases/${release_id}" > "$response_file"
          elif [[ "$status" == 404 ]]; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              "${github_headers[@]}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${payload_file}" \
              "${repository_api}/releases" > "$response_file"
            release_id="$(jq -r '.id' "$response_file")"
          else
            printf 'GitHub release lookup failed with HTTP %s: ' "$status" >&2
            cat "$response_file" >&2
            exit 1
          fi
          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo 'GitHub release response had no numeric id.' >&2; exit 1; }

          existing_assets="$(curl --fail-with-body --silent --show-error \
            "${github_headers[@]}" \
            "${repository_api}/releases/${release_id}/assets?per_page=100")"
          for asset in staging/*; do
            asset_name="$(basename -- "$asset")"
            while IFS= read -r asset_id; do
              [[ -n "$asset_id" ]] || continue
              curl --fail-with-body --silent --show-error \
                --request DELETE \
                "${github_headers[@]}" \
                "${repository_api}/releases/assets/${asset_id}" > /dev/null
            done < <(jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' <<< "$existing_assets")
            encoded_name="$(jq -rn --arg value "$asset_name" '$value | @uri')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              "${github_headers[@]}" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@${asset}" \
              "https://uploads.github.com/repos/firebadnofire/WinTime/releases/${release_id}/assets?name=${encoded_name}" \
              > /dev/null
          done
